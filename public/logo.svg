<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro y tecnológico -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Gradiente principal vibrante para la letra D -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Gradiente brillante para la letra R -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gradiente para el escudo/marco hexagonal -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filtro de sombra paralela moderna y elegante -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo del Logotipo -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Elementos Geométricos de Fondo (Estilo Tech) -->
  <g opacity="0.15" stroke="#3b82f6" stroke-width="1.5" fill="none">
    <polygon points="250,50 410,142 410,327 250,420 90,327 90,142" />
    <polygon points="250,80 380,155 380,345 250,420 120,345 120,155" />
    <line x1="250" y1="50" x2="250" y2="420" />
    <line x1="90" y1="142" x2="410" y2="327" />
    <line x1="90" y1="327" x2="410" y2="142" />
  </g>

  <!-- Marco Hexagonal Principal -->
  <polygon points="250,75 395,158 395,342 250,425 105,342 105,158" 
           fill="none" 
           stroke="url(#borderGrad)" 
           stroke-width="4" 
           stroke-linejoin="round"
           filter="url(#neonGlow)" />

  <!-- Monograma "DR" con Estilo Moderno e Integrado -->
  <g filter="url(#neonGlow)">
    <!-- Letra D -->
    <path d="M 160 160 
             L 245 160 
             C 310 160, 345 195, 345 250 
             C 345 305, 310 340, 245 340 
             L 160 340 
             Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Trazo Interno de la D para efecto dinámico -->
    <path d="M 210 215 
             L 240 215 
             C 270 215, 285 228, 285 250 
             C 285 272, 270 285, 240 285 
             L 210 285 
             Z" 
          fill="none" 
          stroke="url(#bgGlow)" 
          stroke-width="10" />

    <!-- Letra R entrelazada -->
    <path d="M 235 235 
             L 295 340" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />
  </g>

  <!-- Puntos Brillantes de Acento (Detalles tecnológicos) -->
  <circle cx="250" cy="75" r="5" fill="#06b6d4" filter="url(#neonGlow)" />
  <circle cx="395" cy="158" r="5" fill="#3b82f6" filter="url(#neonGlow)" />
  <circle cx="395" cy="342" r="5" fill="#a855f7" filter="url(#neonGlow)" />
  <circle cx="250" cy="425" r="5" fill="#3b82f6" filter="url(#neonGlow)" />
  <circle cx="105" cy="342" r="5" fill="#06b6d4" filter="url(#neonGlow)" />
  <circle cx="105" cy="158" r="5" fill="#a855f7" filter="url(#neonGlow)" />

</svg>
