<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
    <defs>
        <!-- Gradientes para darle un toque moderno y tecnológico -->
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d9ff" />
            <stop offset="100%" stop-color="#0077ff" />
        </linearGradient>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2a" />
            <stop offset="100%" stop-color="#121212" />
        </linearGradient>
    </defs>

    <!-- Fondo (puedes borrar la etiqueta <rect> si prefieres que el fondo sea transparente en tu web) -->
    <rect width="100%" height="100%" fill="#121212" rx="10"/>

    <!-- ICONO / ISOTIPO (Mismo diseño que el anterior) -->
    <g transform="translate(30, 20)">
        <!-- Escudo de soporte técnico -->
        <path d="M 45 5 L 85 18 C 85 45 75 75 45 95 C 15 75 5 45 5 18 Z" fill="url(#shieldGrad)" stroke="url(#blueGrad)" stroke-width="3" />
        
        <!-- Icono de calendario dentro del escudo -->
        <rect x="25" y="25" width="22" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
        <line x1="25" y1="32" x2="47" y2="32" stroke="#ffffff" stroke-width="2" />
        <circle cx="31" cy="40" r="1.5" fill="#00d9ff" />
        <circle cx="36" cy="40" r="1.5" fill="#00d9ff" />
        <circle cx="41" cy="40" r="1.5" fill="#00d9ff" />

        <!-- Llave inglesa cruzada -->
        <path d="M 20 65 L 40 45 L 43 48 L 23 68 Z" fill="url(#blueGrad)" />
        <circle cx="20" cy="67" r="5" fill="none" stroke="url(#blueGrad)" stroke-width="3" />
    </g>

    <!-- TEXTO DEL LOGOTIPO (ACTUALIZADO) -->
    <g transform="translate(135, 60)">
        <!-- Título principal: Ahora dice "CITA" y "DR TECH SOLUTIONS" -->
        <text x="0" y="0" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">
            CITA <tspan fill="#00d9ff">DR TECH</tspan>
        </text>
        <text x="0" y="35" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">
            SOLUTIONS
        </text>
        
        <!-- Eslogan / Subtítulo: Ajustado para mayor claridad -->
        <text x="2" y="60" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#888888" letter-spacing="2">
            RESERVA DE SOPORTE TÉCNICO
        </text>
    </g>
</svg>
